name: Browser Video Export
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/browser-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Real browser video export test
        run: npm run test:e2e
        env:
          CI: "true"
